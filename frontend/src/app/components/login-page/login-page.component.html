<div>
  <h2>Login</h2>
  <form name="form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
    <div>
      <label for="username">Username</label>
      <input 
        required
        type="text"
        name="username"
        [(ngModel)]="form.username"
        #username="ngModel">
    </div>
    <div>
      <label for="password">Password</label>
      <input 
        required
        type="password"
        name="password"
        [(ngModel)]="form.password"
        #password="ngModel">
    </div>
    <button>Login</button>
  </form>
</div>
